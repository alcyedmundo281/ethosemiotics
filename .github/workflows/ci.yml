name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  paquete:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar
        run: pip install -e ".[dev]"
      # Las cuatro puertas de holonmed, en el mismo orden.
      - name: Linter
        run: ruff check .
      - name: Formato
        run: ruff format --check .
      - name: Tipos
        run: mypy
      - name: Tests
        run: pytest -q

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar que no se han colado credenciales
        run: |
          set -e
          patrones='credentials.json|client_secret.*\.json|^token\.json|\.pem$|\.p12$|id_rsa'
          if git ls-files | grep -nEi "$patrones"; then
            echo "::error::Hay archivos de credenciales versionados"
            exit 1
          fi
          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' -- . ':!LICENSE'; then
            echo "::error::Hay una clave privada en el código"
            exit 1
          fi
          echo "Sin credenciales detectadas."
